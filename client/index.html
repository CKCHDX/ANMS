<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANMS Client - Remote SMS Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            word-break: break-word;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.incoming {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #2196f3;
        }

        .message.outgoing {
            background: #f3e5f5;
            color: #6a1b9a;
            border-left: 4px solid #9c27b0;
            margin-left: 20px;
        }

        .message-meta {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid #e0e0e0;
            border-radius: 0 0 12px 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input[type="text"],
        textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
        }

        input[type="text"] {
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 80px;
            margin-bottom: 8px;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-send:active {
            transform: translateY(0);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-clear {
            background: #f44336;
            color: white;
        }

        .btn-clear:hover {
            background: #d32f2f;
        }

        .error {
            color: #c62828;
            background: #ffebee;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .success {
            color: #2e7d32;
            background: #f1f8e9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                height: 100vh;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ANMS Client</h1>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <div class="messages" id="messagesContainer"></div>

        <div class="input-area">
            <div id="notification"></div>
            <div class="input-group">
                <input 
                    type="text" 
                    id="phoneInput" 
                    placeholder="+1234567890"
                    maxlength="20"
                >
            </div>
            <textarea 
                id="messageInput" 
                placeholder="Type your message here..."
            ></textarea>
            <div class="button-group">
                <button class="btn-send" id="sendButton" disabled>Send</button>
                <button class="btn-clear" id="clearButton">Clear</button>
            </div>
        </div>
    </div>

    <script>
        const STATUS_DOT = document.getElementById('statusDot');
        const STATUS_TEXT = document.getElementById('statusText');
        const MESSAGES_CONTAINER = document.getElementById('messagesContainer');
        const PHONE_INPUT = document.getElementById('phoneInput');
        const MESSAGE_INPUT = document.getElementById('messageInput');
        const SEND_BUTTON = document.getElementById('sendButton');
        const CLEAR_BUTTON = document.getElementById('clearButton');
        const NOTIFICATION = document.getElementById('notification');

        let ws = null;
        let isConnected = false;

        // Get host IP from localStorage or prompt
        function getHostAddress() {
            let host = localStorage.getItem('anms_host');
            if (!host) {
                host = prompt('Enter host IP (e.g., 192.168.1.100:8765):', 'localhost:8765');
                if (host) {
                    localStorage.setItem('anms_host', host);
                }
            }
            return host || 'localhost:8765';
        }

        function connectWebSocket() {
            const hostAddress = getHostAddress();
            const wsUrl = `ws://${hostAddress}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                isConnected = true;
                updateStatus('Connected', true);
                showNotification('Connected to ANMS host', 'success');
                SEND_BUTTON.disabled = false;
            };

            ws.onmessage = (event) => {
                const data = event.data;
                const parts = data.split('|');
                
                if (parts.length >= 2) {
                    const phoneNumber = parts[0];
                    const messageBody = parts[1];
                    const timestamp = parts[2] ? new Date(parseInt(parts[2])).toLocaleTimeString() : new Date().toLocaleTimeString();
                    const isOutgoing = parts[3] === 'true';
                    
                    addMessage(phoneNumber, messageBody, timestamp, isOutgoing);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('Error', false);
                showNotification('Connection error', 'error');
            };

            ws.onclose = () => {
                isConnected = false;
                updateStatus('Disconnected', false);
                SEND_BUTTON.disabled = true;
                showNotification('Disconnected from host', 'error');
                // Attempt reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
        }

        function updateStatus(text, connected) {
            STATUS_TEXT.textContent = text;
            if (connected) {
                STATUS_DOT.classList.remove('offline');
            } else {
                STATUS_DOT.classList.add('offline');
            }
        }

        function addMessage(phoneNumber, messageBody, timestamp, isOutgoing = false) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
            messageEl.innerHTML = `
                <div>${escapeHtml(messageBody)}</div>
                <div class="message-meta">${phoneNumber} • ${timestamp}</div>
            `;
            MESSAGES_CONTAINER.appendChild(messageEl);
            MESSAGES_CONTAINER.scrollTop = MESSAGES_CONTAINER.scrollHeight;
        }

        function sendMessage() {
            const phoneNumber = PHONE_INPUT.value.trim();
            const message = MESSAGE_INPUT.value.trim();

            if (!phoneNumber) {
                showNotification('Please enter a phone number', 'error');
                return;
            }

            if (!message) {
                showNotification('Please enter a message', 'error');
                return;
            }

            if (!isConnected) {
                showNotification('Not connected to host', 'error');
                return;
            }

            try {
                ws.send(`${phoneNumber}|${message}`);
                addMessage(phoneNumber, message, new Date().toLocaleTimeString(), true);
                MESSAGE_INPUT.value = '';
                MESSAGE_INPUT.focus();
            } catch (error) {
                showNotification('Error sending message', 'error');
                console.error(error);
            }
        }

        function showNotification(message, type) {
            NOTIFICATION.innerHTML = `<div class="${type}">${escapeHtml(message)}</div>`;
            if (type === 'success') {
                setTimeout(() => {
                    NOTIFICATION.innerHTML = '';
                }, 3000);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        SEND_BUTTON.addEventListener('click', sendMessage);
        MESSAGE_INPUT.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                sendMessage();
            }
        });

        CLEAR_BUTTON.addEventListener('click', () => {
            MESSAGES_CONTAINER.innerHTML = '';
        });

        PHONE_INPUT.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                MESSAGE_INPUT.focus();
            }
        });

        // Initialize
        connectWebSocket();
    </script>
</body>
</html>
